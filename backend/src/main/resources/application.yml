server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: rbac-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: 3600
  is-concurrent: true
  is-share: true
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.company.rbac: info
